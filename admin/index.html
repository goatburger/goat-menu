<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم مينيو جوت</title>

<style>
body{
  font-family:system-ui;
  background:#0b0b0b;
  color:#fff;
  margin:0;
  padding:30px;
}
.card{
  max-width:900px;
  margin:auto;
  background:#111;
  padding:20px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
}
input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  background:#0b0b0b;
  color:#fff;
  font-size:16px;
}
button{
  cursor:pointer;
  background:#d6b45a;
  color:#000;
  font-weight:bold;
  border:none;
}
#msg{
  margin-top:10px;
  font-weight:bold;
}
</style>

</head>
<body>

<div class="card">
<h2>لوحة تحكم مينيو جوت</h2>

<input id="name_ar" placeholder="اسم الوجبة (عربي)">
<input id="price" type="number" step="0.001" placeholder="السعر">
<input id="image" placeholder="رابط الصورة">

<button id="addBtn">إضافة وجبة</button>

<p id="msg"></p>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://dcenkkyxsklzhcnjycoc.supabase.co",
  "sb_publishable_QnMtHgIxfr_CwM89PBKT7g_Li1VqRjp"
);

const msg = document.getElementById("msg");
const addBtn = document.getElementById("addBtn");

addBtn.addEventListener("click", async () => {
  try{
    msg.innerText = "جاري الإضافة...";

    const name_ar = document.getElementById("name_ar").value.trim();
    const priceStr = document.getElementById("price").value.trim();
    let image = document.getElementById("image").value.trim();

    if(!name_ar){
      msg.innerText = "اكتب اسم الوجبة.";
      return;
    }

    const price = Number(priceStr);
    if(!Number.isFinite(price)){
      msg.innerText = "اكتب سعر صحيح مثل 1.500";
      return;
    }

    if(image && !image.startsWith("http")){
      image = "https://" + image;
    }

    const { error } = await supabase
      .from("menu_items")
      .insert([{ name_ar, price, image_url:image || null }]);

    if(error){
      msg.innerText = "خطأ: " + error.message;
    }else{
      msg.innerText = "تمت الإضافة بنجاح ✅";
      document.getElementById("name_ar").value="";
      document.getElementById("price").value="";
      document.getElementById("image").value="";
    }

  }catch(e){
    msg.innerText = "خطأ غير متوقع: " + e.message;
  }
});

</script>

</body>
</html>
