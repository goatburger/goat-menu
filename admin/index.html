<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT Menu Admin</title>

<style>
body{
  font-family:system-ui;
  background:#0b0b0b;
  color:#fff;
  margin:0;
  padding:30px;
}
.card{
  max-width:900px;
  margin:auto;
  background:#111;
  padding:20px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
}
input,textarea,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.2);
  background:#0b0b0b;
  color:#fff;
}
button{
  cursor:pointer;
  background:#d6b45a;
  color:#000;
  font-weight:bold;
}
</style>

</head>
<body>

<div class="card">
<h2>لوحة تحكم مينيو جوت</h2>

<input id="name_ar" placeholder="اسم الوجبة (عربي)">
<input id="price" type="number" step="0.001" placeholder="السعر">
<input id="image" placeholder="رابط الصورة">

<button onclick="addItem()">إضافة وجبة</button>

<p id="msg"></p>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://dcenkkyxsklzhcnjycoc.supabase.co",
  "sb_publishable_QnMtHgIxfr_CwM89PBKT7g_Li1VqRjp"
);

async function addItem(){
  const name_ar = document.getElementById("name_ar").value;
  const price = document.getElementById("price").value;
  const image = document.getElementById("image").value;

  const { error } = await supabase
    .from("menu_items")
    .insert([{ name_ar, price, image_url:image }]);

  if(error){
    document.getElementById("msg").innerText = "خطأ: " + error.message;
  }else{
    document.getElementById("msg").innerText = "تمت الإضافة بنجاح ✅";
  }
}

</script>

</body>
</html>
