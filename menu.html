<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GOAT Menu</title>

  <style>
    :root{
      --bg:#070707;
      --card:#101010;
      --fg:#f5f5f5;
      --muted:#b6b6b6;
      --line:rgba(255,255,255,.10);
      --gold:#d6b45a;
      --radius:16px;
      --max:980px;
      --shadow:0 18px 40px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;
      background: var(--bg);
      min-height:100vh;
    }
    .wrap{max-width:var(--max);margin:auto;padding:18px}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 0;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:46px;height:46px;border-radius:14px;object-fit:cover;
      border:1px solid var(--line);background:#111;
    }
    h1{margin:0;font-size:22px;letter-spacing:.2px}
    .sub{margin:4px 0 0;color:var(--muted);font-size:13px}

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      padding:10px 0 24px;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      gap:12px;
      padding:12px;
      align-items:center;
    }
    .thumb{
      width:92px;height:92px;border-radius:14px;object-fit:cover;
      border:1px solid var(--line);background:#111;flex:0 0 auto;
    }
    .info{flex:1;min-width:0}
    .name{font-weight:900;font-size:16px;margin:0 0 4px}
    .desc{color:var(--muted);font-size:13px;margin:0;line-height:1.4}
    .price{
      flex:0 0 auto;
      font-weight:900;
      color:#000;
      background:var(--gold);
      padding:10px 12px;
      border-radius:12px;
      min-width:88px;
      text-align:center;
    }

    .state{color:var(--muted);font-size:13px;padding:20px 0}
    .hide{display:none}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img id="logo" class="logo" alt="logo" style="display:none" />
        <div>
          <h1 id="brandName">GOAT Menu</h1>
          <div class="sub">المينيو يتحدث تلقائيًا من لوحة التحكم</div>
        </div>
      </div>
    </div>

    <div id="status" class="state">جاري تحميل المينيو…</div>
    <div id="grid" class="grid"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://dcenkkyxsklzhcnjycoc.supabase.co",
      "sb_publishable_QnMtHgIxfr_CwM89PBKT7g_Li1VqRjp"
    );

    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const brandNameEl = document.getElementById("brandName");
    const logoEl = document.getElementById("logo");

    function money(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return "";
      return num.toFixed(3) + " ر.ع";
    }

    function applySettings(s){
      if(!s) return;
      if(s.brand_name) brandNameEl.textContent = s.brand_name;

      if(s.logo_url){
        logoEl.src = s.logo_url;
        logoEl.style.display = "";
      }

      if(s.background_color){
        document.documentElement.style.setProperty("--bg", s.background_color);
      }

      if(s.accent_color){
        document.documentElement.style.setProperty("--gold", s.accent_color);
      }

      if(s.background_image_url){
        document.body.style.backgroundImage =
          `radial-gradient(1200px 600px at 50% -10%, rgba(214,180,90,.08), transparent 60%), url('${s.background_image_url}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        document.body.style.backgroundAttachment = "fixed";
      }else{
        document.body.style.backgroundImage =
          "radial-gradient(1200px 600px at 50% -10%, rgba(214,180,90,.08), transparent 60%)";
      }
    }

    function renderItems(items){
      grid.innerHTML = "";
      for(const it of items){
        const card = document.createElement("div");
        card.className = "card";
        const img = it.image_url ? `<img class="thumb" src="${it.image_url}" alt="">` : `<div class="thumb"></div>`;
        const desc = (it.desc_ar || "").trim();

        card.innerHTML = `
          ${img}
          <div class="info">
            <div class="name">${it.name_ar ?? ""}</div>
            ${desc ? `<p class="desc">${desc}</p>` : `<p class="desc"></p>`}
          </div>
          <div class="price">${money(it.price)}</div>
        `;
        grid.appendChild(card);
      }
    }

    async function load(){
      try{
        statusEl.textContent = "جاري التحميل…";

        // Settings
        const { data: settings, error: se } = await supabase
          .from("menu_settings")
          .select("*")
          .eq("id", 1)
          .single();

        if(!se) applySettings(settings);

        // Items (ظاهر فقط)
        const { data: items, error: ie } = await supabase
          .from("menu_items")
          .select("name_ar,desc_ar,price,image_url,sort_order,is_active,created_at")
          .eq("is_active", true)
          .order("sort_order", { ascending: true })
          .order("created_at", { ascending: false });

        if(ie) throw ie;

        if(!items || items.length === 0){
          statusEl.textContent = "لا توجد وجبات ظاهرة حالياً.";
          return;
        }

        statusEl.classList.add("hide");
        renderItems(items);

      }catch(e){
        statusEl.textContent = "خطأ في تحميل المينيو: " + e.message;
      }
    }

    load();
  </script>
</body>
</html>
