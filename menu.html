<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goat Lab Burger – Menu</title>

  <style>
    :root{
      --bg:#070707;
      --bg2:#0c0c0c;
      --fg:#f5f5f5;
      --muted:#b6b6b6;
      --line:rgba(255,255,255,.10);
      --chip:rgba(255,255,255,.06);
      --gold:#d6b45a;
      --shadow:0 18px 40px rgba(0,0,0,.45);
      --radius:16px;
      --max:980px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(214,180,90,.10), transparent 55%),
        radial-gradient(900px 500px at 10% 0%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Kufi Arabic","Noto Sans Arabic",Arial;
      line-height:1.35;
    }

    .topbar{
      position:sticky; top:0; z-index:50;
      background:rgba(8,8,8,.72);
      backdrop-filter: blur(14px);
      border-bottom:1px solid var(--line);
    }
    .wrap{max-width:var(--max); margin:0 auto; padding:14px 16px;}
    .row{display:flex; gap:12px; align-items:center; justify-content:space-between;}

    .brand{
      display:flex; gap:10px; align-items:center;
      min-width:0;
    }
    .brand img{width:64px; height:auto; object-fit:contain; filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
    .brand .t{display:flex; flex-direction:column; gap:2px; min-width:0;}
    .brand .t b{
      font-size:14px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      letter-spacing:.4px;
    }
    .brand .t span{
      font-size:12px; color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
    .btn{
      appearance:none;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--fg);
      padding:10px 12px;
      border-radius:999px;
      font-size:13px;
      text-decoration:none;
      display:inline-flex; gap:8px; align-items:center;
      transition:.15s;
    }
    .btn:hover{transform:translateY(-1px); box-shadow:0 10px 22px rgba(0,0,0,.35); border-color:rgba(214,180,90,.35);}

    .hero{
      border-bottom:1px solid var(--line);
      position:relative;
      overflow:hidden;
    }
    .hero:before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(800px 380px at 65% 10%, rgba(214,180,90,.14), transparent 60%),
        radial-gradient(700px 320px at 15% 20%, rgba(255,255,255,.08), transparent 55%);
      pointer-events:none;
    }
    .hero .wrap{padding:18px 16px; position:relative;}
    .hero h1{margin:0 0 8px; font-size:18px; letter-spacing:.4px;}
    .hero p{margin:0; color:var(--muted); font-size:13px;}

    .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:14px 0 6px;}
    .search{flex:1; min-width:220px; position:relative;}
    .search input{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      outline:none;
      font-size:14px;
      background:rgba(255,255,255,.04);
      color:var(--fg);
    }
    .search input::placeholder{color:rgba(255,255,255,.45)}
    .search input:focus{border-color:rgba(214,180,90,.55); box-shadow:0 0 0 6px rgba(214,180,90,.10);}

    .chips{
      display:flex;
      flex-direction:row;
      gap:10px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:14px 0 6px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      white-space:nowrap;
    }

    .chips::-webkit-scrollbar{display:none;}

    .chip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      min-width:160px;
      scroll-snap-align:start;
      border:1px solid var(--line);
      background:var(--chip);
      padding:14px 22px;
      border-radius:999px;
      font-size:15px;
      cursor:pointer;
      transition:.15s;
      white-space:nowrap;
      color:var(--fg);
    }
    .chip:hover{border-color:rgba(214,180,90,.35); background:rgba(214,180,90,.08)}
    .chip.active{
      background:linear-gradient(135deg, rgba(214,180,90,.95), rgba(214,180,90,.65));
      color:#090909;
      border-color:rgba(214,180,90,.9);
      font-weight:950;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
      padding:14px 0 40px;
    }
    @media (max-width:720px){
      .grid{grid-template-columns:1fr;}
      .brand .t span{display:none}
    }

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.03);
      padding:14px;
      transition:.15s;
      cursor:pointer;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:0;
      background:radial-gradient(420px 220px at 85% 10%, rgba(214,180,90,.12), transparent 60%);
      opacity:0;
      transition:.15s;
      pointer-events:none;
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow);
      border-color:rgba(214,180,90,.28);
    }
    .card:hover:before{opacity:1;}

    .badge{
      position:absolute; top:12px; left:12px;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(214,180,90,.95);
      color:#0b0b0b;
      font-weight:950;
      z-index:3;
    }

    /* NEW: Image styles */
    .imgWrap{
      width:100%;
      height:170px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:12px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.02);
      border-radius:14px;
      overflow:hidden;
    }
    .imgWrap img{
      width:100%;
      height:100%;
      object-fit:contain;
      filter: drop-shadow(0 16px 30px rgba(0,0,0,.55));
      transform: translateZ(0);
    }

    .title{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
    .name{display:flex; flex-direction:column; gap:4px; min-width:0;}
    .name b{
      font-size:15px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      letter-spacing:.3px;
    }
    .name span{
      font-size:13px;
      color:var(--muted);
      direction:ltr; text-align:left;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .price{
      font-weight:950;
      font-size:14px;
      white-space:nowrap;
      direction:ltr;
      text-align:left;
      color:rgba(214,180,90,.98);
    }
    .desc{margin:10px 0 0; color:rgba(255,255,255,.70); font-size:13px;}

    /* Modal */
    .modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.60);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:100;
      padding:14px;
    }
    .modal.open{display:flex;}
    .sheet{
      width:100%;
      max-width:560px;
      background:rgba(10,10,10,.92);
      border-radius:20px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(14px);
    }
    .sheetTop{
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .close{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--fg);
      font-size:18px;
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
    }
    .sheetBody{padding:14px 16px;}
    .sheetBody .big{font-size:16px; font-weight:950; margin:0 0 6px;}
    .sheetBody .en{margin:0 0 10px; color:var(--muted); direction:ltr; text-align:left;}
    .sheetBody .p{margin:0 0 12px; color:rgba(255,255,255,.80);}

    /* NEW: Modal image */
    .modalImg{
      width:100%;
      height:220px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 0 12px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02);
      border-radius:16px;
      overflow:hidden;
    }
    .modalImg img{
      width:100%;
      height:100%;
      object-fit:contain;
      filter: drop-shadow(0 18px 34px rgba(0,0,0,.60));
    }

    .sheetBody .meta{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      border-top:1px solid var(--line);
      padding-top:12px;
    }
    .sheetBody .meta .price{font-size:16px;}
    .backRow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
    .backRow .btn{flex:1; justify-content:center; min-width:160px;}
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="row">
        <div class="brand">
          <img src="logoW.png" alt="Goat Lab Burger Logo" onerror="this.style.display='none'">
          <div class="t">
            <b>GOAT LAB BURGER</b>
            <span>Salalah • GOAT LAB MENU</span>
          </div>
        </div>

        <div class="actions">
          <a class="btn" href="index.html">الرجوع</a>
        </div>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="wrap">
      <h1>قائمة Goat Lab • Menu</h1>
      <p>للمشاهدة فقط — اختَر القسم واضغط على الصنف للتفاصيل.</p>

      <div class="toolbar">
        <div class="search">
          <input id="q" type="search" placeholder="ابحث عن صنف… Search…" autocomplete="off" />
        </div>
      </div>

      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheetTop">
        <b>تفاصيل الصنف</b>
        <button class="close" id="close" aria-label="Close">×</button>
      </div>
      <div class="sheetBody" id="sheetBody"></div>
    </div>
  </div>

  <script>
    const CATEGORIES = [
      { key: "burgers",  ar: "البرجر",        en: "Burgers" },
      { key: "fries",    ar: "فرايز",         en: "Fries" },

      { key: "drinks",   ar: "مشروبات",       en: "Drinks" },
      { key: "suhoor",   ar: "وجبة السحور",   en: "Suhoor Meal" },
    ];

    const ITEMS = [
      { id:"b1", cat:"burgers", ar:"جوت برجر", en:"GOAT Burger", price:"1.000 ر.ع",
        desc_ar:"شريحة لحم محلي طازج مع شريحة الجبن وصوص جوت برجر الخاص.",
        desc_en:"Fresh local beef patty with cheese slice and GOAT special burger sauce.",
        image:"b1.png",
        tags:["⭐ الأكثر طلبًا"], spicy:false },

      { id:"b2", cat:"burgers", ar:"دبل جوت برجر", en:"Double GOAT Burger", price:"1.500 ر.ع",
        desc_ar:"٢ شريحة لحم محلي طازج مع ٢ شريحة جبن وصوص جوت برجر الخاص.",
        desc_en:"2 fresh local beef patties with 2 cheese slices and GOAT special burger sauce.",
        image:"",
        tags:[], spicy:false },

      { id:"b3", cat:"burgers", ar:"جوت برجر تريبل", en:"Triple GOAT Burger", price:"2.000 ر.ع",
        desc_ar:"٣ شريحة لحم محلي طازج مع ٣ شرائح جبن وصوص جوت برجر الخاص.",
        desc_en:"3 fresh local beef patties with 3 cheese slices and GOAT special burger sauce.",
        image:"",
        tags:[], spicy:false },

      { id:"b4", cat:"burgers", ar:"برجر مشاكيك", en:"Mashakeek Burger", price:"1.000 ر.ع",
        desc_ar:"قطع مشاكيك مشوية مع صوص جوت برجر الخاص داخل خبز طازج.",
        desc_en:"Grilled mashakeek pieces with GOAT special burger sauce in fresh bun.",
        image:"b2.png",
        tags:[], spicy:false },

      { id:"b5", cat:"burgers", ar:"برجر المشروم", en:"Mushroom GOAT Burger", price:"1.200 ر.ع",
        desc_ar:"شريحة لحم طازج مع شريحة الجبن، صلصة المشروم، البصل المكرمل، وصوص جوت الخاص.",
        desc_en:"Fresh beef patty with cheese slice, mushroom sauce, caramelized onions, and GOAT special sauce.",
        image:"",
        tags:[], spicy:false },

      { id:"b6", cat:"burgers", ar:"جوت برجر دجاج", en:"GOAT Chicken Burger", price:"1.000 ر.ع",
        desc_ar:"شريحة دجاج مفروم طازج متبل بخلطة جوت الخاصة، مشوية بإتقان، مع شريحة جبن وصوص جوت داخل خبز طازج.",
        desc_en:"Fresh seasoned minced chicken patty grilled to perfection with cheese slice and GOAT special sauce in a fresh bun.",
        image:"",
        tags:["🐔 دجاج"], spicy:false },

      { id:"f1", cat:"fries", ar:"بطاطس مقلية", en:"French Fries", price:"0.500 ر.ع",
        desc_ar:"بطاطس مقرمشة مقلية مع ملح.",
        desc_en:"Crispy fries seasoned with salt.",
        image:"",
        tags:[], spicy:false },

      { id:"f2", cat:"fries", ar:"فرايز مشاكيك", en:"Mashakeek Fries", price:"1.500 ر.ع",
        desc_ar:"البطاطس المقلية مع لحم المشاكيك الطازج وصوص جوت برجر الخاص.",
        desc_en:"Fries topped with fresh mashakeek meat and GOAT special burger sauce.",
        tags:["⭐ الأكثر طلبًا"], spicy:false },

      { id:"f3", cat:"fries", ar:"سبيشل جوت فرايز", en:"Special GOAT Fries", price:"2.000 ر.ع",
        desc_ar:"البطاطس المقلية مع لحم المشاكيك الطازج والخس والبصل مع صوص الصبار وصوص جوت برجر الخاص.",
        desc_en:"Fries with fresh mashakeek meat, lettuce, onions, cactus sauce, and GOAT special burger sauce.",
        tags:[], spicy:false },

      { id:"f4", cat:"fries", ar:"فرايز المشاكيك والمشروم", en:"Mashakeek & Mushroom Fries", price:"1.700 ر.ع",
        desc_ar:"بطاطس مقلية مع مشاكيك طازجة وصلصة الفطر.",
        desc_en:"Fries topped with fresh mashakeek and mushroom sauce.",
         tags:["⭐ الأكثر طلبًا"], spicy:false },
        

      { id:"m1", cat:"mashakeek", ar:"مشاكيك", en:"Mashakeek Skewers", price:"0.200 ر.ع",
        desc_ar:"مشاكيك مطهي ع الفحم متبل بالفلفل، ملح وبهارات مشكله.",
        desc_en:"Charcoal-grilled mashakeek, seasoned with pepper, salt, and mixed spices.",
        image:"",
        tags:[], spicy:false },

      { id:"m2", cat:"mashakeek", ar:"ساندويتش مشاكيك لبناني", en:"Lebanese Mashakeek Sandwich", price:"0.500 ر.ع",
        desc_ar:"قطع مشاكيك مشوية على الفحم بنكهة مدخنة مميزة، ملفوفة داخل خبز لبناني طازج مع صوص جوت الخاص.",
        desc_en:"Charcoal-grilled beef mashakeek pieces wrapped in fresh Lebanese bread with GOAT special sauce.",
        image:"",
        tags:["🔥 جديد"], spicy:false },

      { id:"d1", cat:"drinks", ar:"مياه", en:"Water", price:"0.100 ر.ع",
        desc_ar:"ماء بارد معتدل.",
        desc_en:"Chilled drinking water.",
        image:"",
        tags:[], spicy:false },

      { id:"d2", cat:"drinks", ar:"كينزا ليمون", en:"Kinza Lemon (300ml)", price:"0.300 ر.ع",
        desc_ar:"مشروب غازي منعش بنكهة الليمون بحجم 300 مل.",
        desc_en:"Refreshing lemon-flavored soft drink (300ml).",
        image:"",
        tags:[], spicy:false },

      { id:"d3", cat:"drinks", ar:"كينزا حمضيات", en:"Kinza Citrus (300ml)", price:"0.300 ر.ع",
        desc_ar:"مشروب غازي منعش بنكهة الحمضيات، عبوة 300 مل.",
        desc_en:"Refreshing citrus-flavored soft drink (300ml).",
        image:"",
        tags:[], spicy:false },

      { id:"d4", cat:"drinks", ar:"دايت كينزا ليمون", en:"Kinza Lemon Zero Sugar (300ml)", price:"0.300 ر.ع",
        desc_ar:"مشروب كينزا دايت منعش بنكهة الليمون المنعشة، 300 مل.",
        desc_en:"Zero sugar lemon soft drink (300ml).",
        image:"",
        tags:["بدون سكر"], spicy:false },

      { id:"d5", cat:"drinks", ar:"دايت كينزا كولا", en:"Kinza Cola Zero Sugar (300ml)", price:"0.300 ر.ع",
        desc_ar:"مشروب كينزا كولا دايت منعش، خالٍ من السكر، 300 مل.",
        desc_en:"Zero sugar cola soft drink (300ml).",
        image:"",
        tags:["بدون سكر"], spicy:false },

      { id:"d6", cat:"drinks", ar:"كينزا كولا", en:"Kinza Cola (300ml)", price:"0.300 ر.ع",
        desc_ar:"مشروب كولا غازي منعش بحجم 300 مل.",
        desc_en:"Refreshing cola soft drink (300ml).",
        image:"",
        tags:[], spicy:false },

      { id:"s1", cat:"suhoor", ar:"رز قبولي خاص مع مشاكيك", en:"Kabuli Rice with Mashakeek", price:"1.700 ر.ع",
        desc_ar:"أرز قبولي تقليدي مطبوخ بالسمن، يُقدّم مع خمس أسياخ مشاكيك لحم بقري مشوي على الفحم مع صوصات.",
        desc_en:"Traditional kabuli rice cooked with ghee, served with 5 beef mashakeek skewers grilled on charcoal with sauces.",
        image:"",
        tags:["⭐ وجبة"], spicy:false },
    ];

    const chips = document.getElementById("chips");
    const grid  = document.getElementById("grid");
    const q     = document.getElementById("q");
    const modal = document.getElementById("modal");
    const close = document.getElementById("close");
    const sheetBody = document.getElementById("sheetBody");

    let activeCat = CATEGORIES[0].key;

    function hasImage(it){
      return typeof it.image === "string" && it.image.trim().length > 0;
    }

    function renderChips(){
      chips.innerHTML = "";
      CATEGORIES.forEach(c => {
        const el = document.createElement("div");
        el.className = "chip" + (c.key === activeCat ? " active" : "");
        el.textContent = `${c.ar} • ${c.en}`;
        el.onclick = () => {
          activeCat = c.key;
          document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
          el.classList.add("active");
          renderGrid();
        };
        chips.appendChild(el);
      });
    }

    function renderGrid(){
      const query = (q.value || "").trim().toLowerCase();

      const list = ITEMS
        .filter(it => it.cat === activeCat)
        .filter(it => {
          if(!query) return true;
          const hay = `${it.ar} ${it.en} ${it.desc_ar} ${it.desc_en}`.toLowerCase();
          return hay.includes(query);
        });

      grid.innerHTML = "";

      if(list.length === 0){
        const empty = document.createElement("div");
        empty.style.gridColumn = "1 / -1";
        empty.style.padding = "20px 6px";
        empty.style.color = "rgba(255,255,255,.65)";
        empty.textContent = "مافي نتائج… جرّب كلمة ثانية.";
        grid.appendChild(empty);
        return;
      }

      list.forEach(it => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openModal(it);

        if(it.tags && it.tags.length){
          const badge = document.createElement("div");
          badge.className = "badge";
          badge.textContent = it.tags[0];
          card.appendChild(badge);
        }

        // NEW: optional image block
        if(hasImage(it)){
          const imgWrap = document.createElement("div");
          imgWrap.className = "imgWrap";

          const img = document.createElement("img");
          img.src = it.image;
          img.alt = `${it.ar} - ${it.en}`;
          img.loading = "lazy";
          img.onerror = () => { imgWrap.remove(); };

          imgWrap.appendChild(img);
          card.appendChild(imgWrap);
        }

        const title = document.createElement("div");
        title.className = "title";

        const name = document.createElement("div");
        name.className = "name";
        name.innerHTML = `<b>${it.ar}</b><span>${it.en}</span>`;

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = it.price;

        title.appendChild(name);
        title.appendChild(price);

        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = it.desc_ar;

        card.appendChild(title);
        card.appendChild(desc);

        grid.appendChild(card);
      });
    }

    function openModal(it){
      const imgHtml = hasImage(it)
        ? `<div class="modalImg"><img src="${it.image}" alt="${it.ar} - ${it.en}" onerror="this.closest('.modalImg').remove()"></div>`
        : "";

      sheetBody.innerHTML = `
        ${imgHtml}
        <div class="big">${it.ar}</div>
        <div class="en">${it.en}</div>
        <div class="p">${it.desc_ar}</div>
        <div class="p" style="color:rgba(255,255,255,.60); direction:ltr; text-align:left">${it.desc_en}</div>

        <div class="meta">
          <div class="price">${it.price}</div>
          <div style="color:rgba(255,255,255,.55); font-size:13px; direction:ltr">OMR</div>
        </div>

        <div class="backRow">
          <button class="btn" style="cursor:pointer" onclick="document.getElementById('modal').classList.remove('open')">رجوع</button>
        </div>
      `;
      modal.classList.add("open");
    }

    function closeModal(){ modal.classList.remove("open"); }

    close.onclick = closeModal;
    modal.onclick = (e) => { if(e.target === modal) closeModal(); };
    document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeModal(); });
    q.addEventListener("input", renderGrid);

    renderChips();
    renderGrid();
  </script>
</body>
</html>
