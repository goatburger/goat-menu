<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جوت لاب برجر</title>

<style>
  :root{
    --text:#000;
    --muted:#555;
    --border:#e8e8e8;
    --bg:#fff;
    --btn:#111;
    --radius:16px;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .wrap{
    width:min(420px, calc(100% - 28px));
    padding:32px 0 36px;
  }

  .logo{
    width:180px;
    max-width:70vw;
    margin:0 auto 18px;
    display:block;
    animation:float 2.5s ease-in-out infinite;
  }

  .title{
    font-size:24px;
    font-weight:900;
    margin:0 0 6px;
  }

  .tag{
    color:var(--muted);
    font-size:13px;
    margin:0 0 22px;
  }

  .btn{
    display:block;
    width:100%;
    padding:14px 16px;
    border-radius:var(--radius);
    text-decoration:none;
    font-weight:800;
    border:1px solid var(--border);
    margin:10px 0;
    box-sizing:border-box;
  }

  .btn.primary{
    background:var(--btn);
    color:#fff;
  }

  .btn.secondary{
    background:#fff;
    color:#111;
  }

  .note{
    margin-top:18px;
    font-size:14px;
    color:var(--muted);
    line-height:1.7;
  }

  .small{
    margin-top:18px;
    font-size:12px;
    color:#888;
  }

  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
</style>
</head>

<body>

<main class="wrap">

  <!-- الشعار -->
  <img src="logo-white-transparent.png" class="logo" alt="جوت لاب برجر"
       onerror="this.style.display='none'">

  <!-- الاسم -->
  <div class="title">جوت لاب برجر 🐐🔥</div>
  <div class="tag">الأفضل على الإطلاق</div>

  <!-- زر المينيو -->
  <a class="btn primary"
     href="menu.html"
     target="_blank" rel="noopener">
    📖 تصفّح المينيو
  </a>

  <!-- روابط التواصل -->
  <a class="btn secondary"
     href="https://www.instagram.com/goatburger.om?igsh=cnJpang0YjBpMnRk"
     target="_blank" rel="noopener">
    📸 حسابنا على إنستجرام
  </a>

  <a class="btn secondary"
     href="https://www.snapchat.com/unlock/?type=SNAPCODE&uuid=24f979518691434faf3fa2b6ffcdf425&metadata=01"
     target="_blank" rel="noopener">
    👻 فلتر سناب شات
  </a>

  <a class="btn secondary"
     href="https://maps.app.goo.gl/9JZ7E6RcKXPKV4mT9?g_st=ic"
     target="_blank" rel="noopener">
    ⭐ قيّمنا على خرائط Google
  </a>

  <!-- عبارة ختامية -->
  <div class="note">
    عيش التجربة… مو مجرد وجبة 🐐🔥
  </div>

  <div class="small">© 2026 جوت لاب برجر</div>

</main>

</body>
</html>
